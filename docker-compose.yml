name: repairflow

services:
  db:
    # Та же мажорная версия, что и в Neon, — чтобы локально и в проде вело себя одинаково.
    image: postgres:18-alpine
    container_name: repairflow-db
    environment:
      POSTGRES_DB: repairflow
      POSTGRES_USER: repairflow
      POSTGRES_PASSWORD: repairflow
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repairflow -d repairflow"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      # Контекст — папка backend, поэтому пути внутри Dockerfile не знают про монорепу.
      context: ./backend
      dockerfile: src/RepairFlow.Api/Dockerfile
    container_name: repairflow-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__Default: "Host=db;Port=5432;Database=repairflow;Username=repairflow;Password=repairflow"
      # В реальном деплое секрет приходит из переменных окружения площадки, а не из файла.
      Jwt__Key: "${JWT_KEY:-local-development-secret-key-please-change-32}"
      Jwt__CrossSiteCookies: "false"
      Demo__SeedOnStartup: "true"
      Cors__Origins__0: "http://localhost:5173"
      Cors__Origins__1: "http://localhost:4173"
    ports:
      # Внутри контейнера приложение слушает 10000 — тот же порт, что и в облаке.
      - "5080:10000"
    volumes:
      - storage:/app/storage

volumes:
  pgdata:
  storage:
