# Blueprint для Render: подключаете репозиторий один раз, дальше каждый push в main
# пересобирает и выкатывает API. База живёт отдельно в Neon — бесплатный Postgres
# у Render истекает через 30 дней, для портфолио это мина замедленного действия.
services:
  - type: web
    name: repairflow-api
    runtime: docker
    plan: free
    # Тот же регион, что и база в Neon: лишний океан между API и Postgres не нужен.
    region: frankfurt
    dockerfilePath: ./backend/src/RepairFlow.Api/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production

      # PORT здесь намеренно не задан: контейнер по умолчанию слушает 10000 — ровно тот порт,
      # который Render ждёт, если переменной нет. Так образ поднимается и на сервисе,
      # созданном вручную, мимо этого блюпринта.

      # Строка подключения к Neon. Значение вводится в дашборде при создании блюпринта
      # и в репозиторий не попадает.
      - key: ConnectionStrings__Default
        sync: false

      # Секрет подписи токенов Render сгенерирует сам — его вообще никто не увидит.
      - key: Jwt__Key
        generateValue: true

      # Браузер видит API на домене фронтенда — запросы разворачивает rewrite на Vercel,
      # так что кука с refresh-токеном first-party и ей хватает SameSite=Lax.
      # SameSite=None понадобился бы только при прямом обращении к этому домену,
      # а такую куку современные браузеры всё чаще просто выбрасывают.
      - key: Jwt__CrossSiteCookies
        value: "false"

      # Адрес фронтенда на Vercel — вводится в дашборде после первого деплоя фронта.
      - key: Cors__Origins__0
        sync: false

      - key: Demo__SeedOnStartup
        value: "true"
