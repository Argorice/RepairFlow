<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: приложение само учитывает вырез экрана и полоску «домой» через safe-area -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f5f9" />
    <meta name="color-scheme" content="light dark" />
    <title>RepairFlow — repair shop job tracking</title>
    <meta
      name="description"
      content="Repair intake, online estimate approval and technician workload for a device repair shop."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <!--
      Тема и язык применяются до первой отрисовки. Иначе тёмная тема мигнула бы белым,
      пока загружается бандл. Ключи совпадают с src/lib/theme.ts и src/i18n/index.ts.
    -->
    <script>
      ;(function () {
        try {
          var root = document.documentElement
          var theme = localStorage.getItem('rf.theme')
          var dark =
            theme === 'dark' ||
            ((!theme || theme === 'system') && matchMedia('(prefers-color-scheme: dark)').matches)
          root.dataset.theme = dark ? 'dark' : 'light'

          var locale = localStorage.getItem('rf.locale')
          if (locale === 'ru' || locale === 'en') root.lang = locale
        } catch (error) {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
